<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazing Hand 上位机</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #4CAF50;
            --danger-color: #ff5252;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 10px; }
        .status-bar {
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.9em;
        }
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--danger-color);
            transition: background-color 0.3s;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 两列布局 */
            gap: 15px;
            max-width: 800px;
            width: 100%;
        }
        .motor-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .motor-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .value-display {
            color: var(--accent-color);
            font-family: monospace;
        }
        .btn-reset {
            margin-top: 30px;
            padding: 12px 30px;
            background-color: var(--danger-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-reset:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <h1>🤖 Amazing Hand 控制台</h1>

    <div class="status-bar">
        <div id="connection-dot" class="status-indicator"></div>
        <span id="connection-text">未连接后端 (127.0.0.1:8000)</span>
    </div>

    <div class="grid-container" id="sliders-container">
        </div>

    <button class="btn-reset" onclick="resetAll()">🛑 全部归零 (Reset)</button>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        const MOTOR_COUNT = 8;
        const SYNC_INTERVAL = 50; // ms (20Hz)

        // 初始化状态数组
        let motorValues = new Array(MOTOR_COUNT).fill(0.0);
        let isConnected = false;

        // 1. 动态生成滑块
        const container = document.getElementById('sliders-container');
        for (let i = 0; i < MOTOR_COUNT; i++) {
            const card = document.createElement('div');
            card.className = 'motor-card';
            card.innerHTML = `
                <div class="motor-header">
                    <span>Motor ID ${i}</span>
                    <span class="value-display" id="val-${i}">0.00</span>
                </div>
                <input type="range" id="slider-${i}" min="-1.57" max="1.57" step="0.01" value="0">
            `;
            container.appendChild(card);

            // 绑定事件：滑块拖动时更新本地数组
            const slider = card.querySelector('input');
            slider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                motorValues[i] = val;
                document.getElementById(`val-${i}`).innerText = val.toFixed(2);
            });
        }

        // 2. 核心循环：定时将数据发送给后端
        async function syncLoop() {
            try {
                const response = await fetch(`${API_URL}/control`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ values: motorValues })
                });

                if (response.ok) {
                    setConnectionStatus(true);
                } else {
                    setConnectionStatus(false);
                }
            } catch (error) {
                setConnectionStatus(false);
            }
        }

        // 3. UI 状态更新
        function setConnectionStatus(connected) {
            const dot = document.getElementById('connection-dot');
            const text = document.getElementById('connection-text');
            if (connected) {
                dot.style.backgroundColor = '#4CAF50'; // Green
                text.innerText = "✅ 已连接 (Online)";
            } else {
                dot.style.backgroundColor = '#ff5252'; // Red
                text.innerText = "❌ 连接断开 (Offline)";
            }
        }

        // 4. 归零功能
        function resetAll() {
            motorValues.fill(0.0);
            // 更新所有 UI
            for (let i = 0; i < MOTOR_COUNT; i++) {
                document.getElementById(`slider-${i}`).value = 0;
                document.getElementById(`val-${i}`).innerText = "0.00";
            }
            // 立即发送一次
            syncLoop();
        }

        // 启动定时器
        setInterval(syncLoop, SYNC_INTERVAL);

    </script>
</body>
</html>
